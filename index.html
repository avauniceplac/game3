<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integração Morfofuncional — UNICEPLAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="hud">
    <img class="hud-logo" id="hudLogo" alt="UNICEPLAC Centro Universitário">
    <div class="hud-right">
      <button class="mute-btn" id="muteBtn" aria-label="Ligar ou desligar som" title="Som">🔊</button>
      <div class="streak" id="streakBox"><span class="fire">🔥</span><span id="streakN">0</span></div>
      <div class="xp-wrap">
        <div class="xp-label">XP <span id="xpTxt">0</span></div>
        <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
      </div>
      <div class="lvl-badge" id="lvl">1</div>
    </div>
  </div>
  <div id="stage"></div>
</div>
<div id="confetti"></div>
<div class="sr-status" aria-live="polite" id="srStatus"></div>

<script src="script.js"></script>
</body>
</html>
